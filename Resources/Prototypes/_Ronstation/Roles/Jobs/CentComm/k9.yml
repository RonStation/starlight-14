- type: job
  id: CentralCommandK9
  roleType: CentCommAligned
  name: job-name-cck9
  description: job-description-cck9
  playTimeTracker: JobCCK9
  setPreference: true
  whitelisted: true # In-line with other CC roles
  startingGear: CentcomK9Gear
  icon: JobIconCCK9
  rules: job-rules-corporate-aligned
  supervisors: job-supervisors-ccsec
  jobEntity: MobCCK9
  bypassEorPacification: true
  accessGroups:
  - AllAccess
  access:
  - CentralCommand
  special:
  - !type:AddComponentSpecial
    components:
    - type: SkipLoadingCharacterRecords
    - type: UseEntityNameAsCharacterName # the dog's name is the character's, not the profile's
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant, DeathRattleImplantCentcomm, CommandTrackingImplant ]
  - !type:EquipStartingGearSpecial
    gear: CentcomK9Gear
  applyTraits: false

- type: startingGear
  id: CentcomK9Gear
  equipment:
    mask: ClothingMaskGasSecurity
    suitstorage: DoubleEmergencyOxygenTankFilled
    eyes: ClothingEyesHudCCK9
    id: CentComDivisionCollarPDA
