# Ready-to-go loadout for an ERT engineer.
- type: startingGear
  id: ERTEngineerAdmemeGearEVA
  equipment:
    jumpsuit: ClothingUniformJumpsuitERTEngineer
    back: ClothingBackpackRTEngineerFilled
    shoes: ClothingShoesBootsMagAdv
    mask: ClothingMaskGasERT
    eyes: ClothingEyesGlassesMeson
    gloves: ClothingHandsGlovesCentComm # The reason for this is so CC characters have a distinct glove fiber, to help not stress out detectives. Its functionally the same as combat gloves, of course.
    outerClothing: ClothingOuterHardsuitERTEngineer
    id: ERTEngineerPDA
    ears: ClothingHeadsetAltAdminCentCom
    belt: ClothingBeltChiefEngineerFilled
    pocket1: LanternFlash
    pocket2: FlashlightSeclite
  inhand:
    - MindShieldImplanter
    - DeathRattleImplanterCentcomm
# Ready-to-go loadout for an ERT leader. Comes with a combat shotgun.
- type: startingGear
  id: ERTLeaderAdmemeShotgunEVA
  equipment:
    jumpsuit: ClothingUniformJumpsuitERTLeader
    back: ClothingBackpackERTLeaderShotgunFilled
    shoes: ClothingShoesBootsMagAdv
    mask: ClothingMaskGasERT
    eyes: ClothingEyesGlassesCentComm
    gloves: ClothingHandsGlovesCentComm
    outerClothing: ClothingOuterHardsuitERTLeader
    neck: ClothingDogTags
    id: ERTLeaderPDA
    ears: ClothingHeadsetAltAdminCentCom
    belt: ClothingBeltNTNCRigFilled
    pocket1: WeaponRevolverMatebaAP
    pocket2: FlashlightSeclite
    suitstorage: WeaponShotgunCombat # Don't sleep on this. Fires quick and I believe has a tighter spread.
  inhand:
    - MindShieldImplanter
    - DeathRattleImplanterCentcomm
