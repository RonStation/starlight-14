# Versions of the holofans with microreactors that cannot be removed, Cyborgs have them normally. This is just for fills.
- type: entity
  parent: HolofanProjector
  suffix: Admeme, DO NOT MAP
  id: HolofanProjectorRecharging
  name: upgraded holofan
  description: Stop suicidal assistants from killing everyone during atmos emergencies, utilizing a sealed microreactor
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor
        disableEject: true
        swap: false
