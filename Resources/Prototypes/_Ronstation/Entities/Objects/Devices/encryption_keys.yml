#Semper: I am the one who originally made this file for Phoenixstation, but since I'm adding to it I'd rather just move it here so people who want to mess with it in the future don't have to go hunt for this file.
- type: entity
  parent: [EncryptionKeyStationMaster]
  id: EncryptionKeyStationMasterUnremovable # This should only be used for headsets in admemes, so that additional master keys are not unfairly added to the round to steal.
  suffix: Unremovable
  components:
  - type: Unremoveable # Just like Starlight's unremovable NTP key
- type: entity
  parent: [EncryptionKeyCentCom]
  id: EncryptionKeyCentcomUnremovable # Since I did this for one wizden key, adding this for other contributions to potentially use
  suffix: Unremovable
  components:
  - type: Unremoveable
- type: entity
  parent: [EncryptionKeyExpedition]
  id: EncryptionKeyExpeditionUnremovable # Mostly just so the CC headset with exped comms is also unremovable like all of its other channels (they're meant to be intrinsic and technically not done through keys)
  suffix: Unremovable
  components:
  - type: Unremoveable
