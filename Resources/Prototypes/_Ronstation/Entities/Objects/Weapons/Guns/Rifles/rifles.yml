- type: entity
  name: CCSD annie # not limited to CCSD, its just made by them
  suffix: ERT
  parent: [BaseCentcommContraband, WeaponRifleAnnie]
  id: WeaponRifleAnnieCCSD
  description: A beast designed to take on the worst the sector has to offer. This one has been modified by members of the Security Division; a scope, full range of firing modes, and even automated magazine ejection to keep up with the firepower of the Syndicate. Uses .30 rifle ammo.
  components:
  - type: Sprite
    sprite: _Ronstation/Objects/Weapons/Guns/Rifles/secannie.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Ronstation/Objects/Weapons/Guns/Rifles/secannie.rsi
  - type: Gun
    availableModes:
    - FullAuto
    - Burst
    - SemiAuto
  - type: ChamberMagazineAmmoProvider
    autoEject: true
    soundAutoEject:
      path: /Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg # TODO: Custom autoeject alarm sound, maybe for reuse with any NT armaments with the feature? My suggestion: A much harsher tone
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifleIncendiary
        priority: 2
        whitelist:
          tags:
            - MagazineLightRifle
      gun_chamber:
        name: Chamber
        startingItem: CartridgeLightRifleIncendiary
        priority: 1
        whitelist:
          tags:
            - CartridgeLightRifle
  - type: CanDualWield # this is just because its funny. abuse it you lose it though
    dualWieldInaccuracyPenalty: 50
  - type: SpeedModifiedOnWield
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 2.5
    pvsIncrease: 0.3
