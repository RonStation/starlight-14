- type: entity
  abstract: true
  parent: [ BaseItem, BaseSecurityContraband ]
  id: BaseSpeedLoaderMagnum50
  name: "speed loader (.50 magnum)"
  components:
  - type: Tag
    tags:
      - SpeedLoaderMagnum50
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - CartridgeMagnum50
    capacity: 6
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/Magnum/magnum_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: base-6
        map: [ "enum.GunVisualLayers.Mag" ]
      - state: base-tip-6
        map: [ "enum.GunVisualLayers.Tip" ]
        color: "#C7B458"
  - type: MagazineVisuals
    magState: base
    steps: 7
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: BaseSpeedLoaderMagnum50
  id: SpeedLoaderMagnum50Empty
  name: "speed loader (.50 magnum any)"
  suffix: empty
  description: Designed to quickly load up to six rounds of .50 magnum into an empty revolver.
  components:
  - type: BallisticAmmoProvider
    proto: null
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/Magnum/magnum_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      # TODO: This is actually a issue with all the speed loaders:
      #       You can mix different ammo types, but it will always
      #       use the one it was printed for.
      - state: base-6
        map: [ "enum.GunVisualLayers.Mag" ]
- type: entity
  id: SpeedLoaderMagnum50Incendiary
  name: "speed loader (.50 magnum incendiary)"
  parent: BaseSpeedLoaderMagnum50
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnum50Incendiary
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/Magnum/magnum_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: base-6
        map: [ "enum.GunVisualLayers.Mag" ]
      - state: base-tip-6
        map: [ "enum.GunVisualLayers.Tip" ]
        color: "#BFC8CA"

- type: entity
