  id: BaseCartridgeMagnum50
  name: cartridge (.50 magnum)
  components:
  - type: Tag
    tags:
      - CartridgeMagnum50
  - type: CartridgeAmmo
    proto: BulletMagnum50TraceSP
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: BaseCartridgeMagnum50
  id: CartridgeMagnum50SP
  name: cartridge (.50 magnum SP)
  description: Heavy magnum cartridge mostly used by revolvers. Standard kinetic ammunition is common and useful in most situations.
  components:
  - type: CartridgeAmmo
    proto: BulletMagnum50TraceSP
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#3F47DB"

