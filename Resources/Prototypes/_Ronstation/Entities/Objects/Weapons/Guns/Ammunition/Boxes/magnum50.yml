- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBoxMagnum50
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeMagnum50
    proto: CartridgeMagnum50SP
    capacity: 12
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Ronstation/Objects/Weapons/Guns/Ammunition/Boxes/magnum50.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: false
  - type: Appearance

# Boxes
- type: entity
  parent: BaseMagazineBoxMagnum50
  id: MagazineBoxMagnum50SP
  name: ammunition box (.50 magnum SP)
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnum50SP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: sp

