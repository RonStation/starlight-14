### magnum (this is a copy of upstream's hitscan tracers, )

- type: entity
  id: BulletMagnum50TraceSP
  parent: BulletTrace
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    armorPenetration: -0.13
    damage:
      types:
        Piercing: 35
  - type: HitscanStaminaDamage
    staminaDamage: 4
  - type: HitscanPierce
    chance: 0.40
    deviation: 0.05
  - type: HitscanRicochet
    chance: 0.30
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: _Starlight/Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle
    travelFlash:
      sprite: _Starlight/Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: trace
    impactFlash:
      sprite: _Starlight/Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact
    bullet:
      sprite:
        sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
        state: sp

