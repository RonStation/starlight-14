- type: entity
  id: ClothingBackpackHoldingChameleon
  parent: [ClothingBackpackHolding, BaseChameleon]
  suffix: Admeme, Chameleon, DO NOT MAP
  components:
  - type: ChameleonClothing
    slot: [back]
    default: ClothingBackpackHolding
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.ChameleonUiKey.Key:
        type: ChameleonBoundUserInterface
  - type: Tag
    tags: # Explicitly defined, to prevent duplicate entries in chameleon items.
    - ScurretWearable # Here because it allows for more admeme shenanigans. Remember to chameleon it so it doesn't look strange!
    - CorgiWearable
- type: entity
  id: ClothingBackpackHoldingCC
  parent: [ClothingBackpackHoldingChameleon, BaseCentcommContraband]
  suffix: CCO, Chameleon, DO NOT MAP
  name: lavish backpack of holding
  description: An expensive backpack that opens into a localized pocket of bluespace. Custom tailored to CentComm's signature branding. Fancy!
  components:
  - type: ChameleonClothing
    slot: [back]
    default: ClothingBackpackHoldingCC
  - type: Tag
    tags: # Has to be seperately defined as the original is not whitelisted.
    - ScurretWearable
    - CorgiWearable
    - WhitelistChameleon
  - type: Sprite
    sprite: _Ronstation/Clothing/Back/Backpacks/ccholding.rsi
    state: holding
    layers:
    - state: holding
    - state: holding-unlit
      shader: unshaded
#A generic entry used for fills in outfits or other purposes. This intentionally does NOT have chameleonwhitelist, to prevent duplicate chameleon entries for the same sprite.
- type: entity
  id: ClothingBackpackHoldingBaseCCFill
  parent: ClothingBackpackHoldingCC
  components:
  - type: Tag
  tags:
    - ScurretWearable
    - CorgiWearable
