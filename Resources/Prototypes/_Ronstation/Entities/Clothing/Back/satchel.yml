#I should've made this a seperate prototype in the first place,
- type: entity
  id: ClothingBackpackSatchelHoldingRSChameleon
  parent: [ClothingBackpackSatchelHolding, BaseChameleon]
  suffix: Admeme, Chameleon, DO NOT MAP
  components:
  - type: ChameleonClothing
    slot: [back]
    default: ClothingBackpackSatchelHolding
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.ChameleonUiKey.Key:
        type: ChameleonBoundUserInterface
  - type: Tag
    tags: # Explicitly defined, to prevent duplicate entries in chameleon items.
    - ScurretWearable # Here because it allows for more admeme shenanigans. Remember to chameleon it so it doesn't look strange!
    - CorgiWearable
- type: entity
  id: ClothingBackpackSatchelHoldingRSChameleonCC
  parent: [ClothingBackpackSatchelHoldingRSChameleon, BaseCentcommContraband]
  suffix: CCO, Chameleon, DO NOT MAP
  name: lavish satchel of holding
  description: An expensive satchel that opens into a localized pocket of bluespace. Custom tailored to CentComm's signature branding. Fancy!
  components:
  - type: ChameleonClothing
    slot: [back]
    default: ClothingBackpackSatchelHoldingRSChameleonCC
  - type: Tag
    tags: # Has to be seperately defined as the original is not whitelisted.
    - ScurretWearable
    - CorgiWearable
    - WhitelistChameleon # Because this has a unique sprite, and defaults to itself.
  - type: Sprite
    sprite: _Ronstation/Clothing/Back/Satchels/ccholding.rsi
    state: icon
    layers:
    - state: icon
    - state: icon-unlit
      shader: unshaded
