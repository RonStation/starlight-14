- type: job
  id: SalvageLead
  name: job-name-salvagelead
  description: job-description-salvagelead
  rules: job-rules-itg-aligned
  playTimeTracker: JobSalvageLead
  whitelisted: true # Ronstation: Salvgone. Making it whitelisted because it is a good idea, but causes issues in lowpop.
  supervisors: job-supervisors-guild
  requirements:
    - !type:DepartmentTimeRequirement
      department: Command
      time: 5h # 5 hours
    - !type:RoleTimeRequirement
      role: JobSalvageSpecialist
      time: 18000 # 5 hours
  icon: "JobIconSalvageLead"
  startingGear: SalvageLeadGear
  displayWeight: 5
  access:
  - Salvage
  - SalvageLead
  - Cargo #Ronstation: Keeping Salvage slightly attached to the station.
  - Mining #Ronstation: Mining needed since Salvage is unmapped from all upstream maps, and this is the only area they'd reasonably bring/unload shit to/in.
  - Command #Ronstation
  - Debrief #Ronstation: In line with giving salvlead command comms, it makes sense they'd be a regular plus-one to debrief when in play.
  - External
  - Maintenance
  - Shuttle
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: NoObjectiveTarget

- type: startingGear
  id: SalvageLeadGear
  equipment:
    ears: ClothingHeadsetSalvageLead
  #storage:
    #back:
    #- Stuff

- type: chameleonOutfit
  id: SalvageLeadChameleonOutfit
  job: SalvageLead
  equipment:
    head: ClothingHeadHatCargosoft
    eyes: ClothingEyesGlassesCheapSunglasses
    mask: ClothingMaskGasExplorer
    outerClothing: ClothingOuterWinterMiner
