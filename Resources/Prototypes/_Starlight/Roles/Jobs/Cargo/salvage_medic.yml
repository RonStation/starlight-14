- type: job
  id: SalvageMedic
  name: job-name-salvagemedic
  description: job-description-salvagemedic
  rules: job-rules-itg-aligned
  playTimeTracker: JobSalvageMedic
  whitelisted: true # Ronstation: Salvgone. Making it whitelisted because it is a good idea, but causes issues in lowpop.
  requirements:
    - !type:RoleTimeRequirement
      role: JobSalvageSpecialist
      time: 36000 # 10 hours
    - !type:RoleTimeRequirement
      role: JobParamedic
      time: 18000 # 5 hours
  icon: "JobIconSalvageMedic"
  startingGear: SalvageMedicGear
  supervisors: job-supervisors-itg
  displayWeight: 4
  access:
  - Salvage
  - Maintenance
  - External
  - Cargo #Ronstation: Keeping Salvage slightly attached to the station.
  - Mining #Ronstation: Mining needed since Salvage is unmapped from all upstream maps, and this is the only area they'd reasonably bring/unload shit to/in.
  extendedAccess: # Ronstation start: Granting skeleton access for anyone whitelisted being able to help the station during lowpop
  - Chemistry
  - Paramedic
  - Surgery # Ronstation end
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: NoObjectiveTarget

- type: startingGear
  id: SalvageMedicGear
  equipment:
    ears: ClothingHeadsetSalvageMed

- type: chameleonOutfit
  id: SalvageMedicChameleonOutfit
  job: SalvageMedic
  equipment:
    head: ClothingHeadHatCargosoft
    eyes: ClothingEyesGlassesCheapSunglasses
    mask: ClothingMaskGasExplorer
    outerClothing: ClothingOuterWinterMiner
    neck: ClothingNeckScarfStripedBrown
    gloves: ClothingHandsGlovesColorBlack
