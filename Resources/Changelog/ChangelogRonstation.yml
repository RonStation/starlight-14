  changes:
  - message: New unique Shadekin sounds for talking and laughing.
    type: Add
  - message: Moved existing Shadekin lore to a book, and added it to the bookshelf
      fill pool.
    type: Add
  - message: Clamping on Shadekin eye color removed, alongside disabling the enforcement
      of no glowing eyes.
