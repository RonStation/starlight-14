- author: Semper
  changes:
  - message: Atlas and the new dev map should both actually start with atmospherics
      in areas that were previously vacuums.
    type: Fix
  id: 2701
  time: '2026-10-07T01:02:54.000000+00:00'
  url: https://github.com/RonStation/starlight-14/pull/27
- author: Semper
  changes:
  - message: Added new IDs for ALL CentComm divisions and their respective heads.
    type: Add
  - message: Added new Job icons for all CentComm divisions that were missing one.
    type: Add
  - message: Added a new hardsuit for the CentComm Security Division that effectively
      parents off of the ERT Leader's hardsuit.
    type: Add
  - message: Added chameleon versions of holding bags for CC characters and admeme
      usage, as seperate prototypes from fills.
    type: Add
  - message: New sprites for CentComm bags of holding, to make them visually distinct
      by default.
    type: Add
  - message: CentComm officials now get a choice of gas mask and gloves, including
      a new pair of gloves in CentComm green.
    type: Add
  - message: Added a new CentComm Borgi chassis with the CentComm lawset; it is intended
      for lowpop assistance and for helping with events.
    type: Add
  - message: CCO loadouts now use the CC holding bags.
    type: Tweak
  - message: Attempted to better balance the equipment of the CC security division
      head bag fill for normal gameplay.
    type: Tweak
  - message: Chameleon bags of holding are now scurret and corgi wearable, for admeme
      character flexibility.
    type: Tweak
  - message: All CC (debug) outfits now use the CC green gloves, as they have a "formal
      green" fiber for forensics.
    type: Tweak
  - message: Fixed some fills and outfits not using the correct items.
    type: Fix
  - message: Manually added internals to the CentComm Official loadout.
    type: Fix
  id: 2601
  time: '2026-10-07T01:14:10.000000+00:00'
