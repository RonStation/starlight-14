- author: Semper, Pcer (based on their contributions to another fork)
  changes:
  - message: Removed SecurityDrill and IonStormPlus from scheduler pool.
    type: Remove
  - message: NTRep, CCO/DS, Magistrate, and NTCT are now whitelisted.
    type: Tweak
  - message: BSO is no longer whitelisted, in-line with previous Ronstation forks.
    type: Tweak
  - message: You can now have one more language than before (not including foreigner
      bonus).
    type: Tweak
  - message: Translators are significantly easier to maintain, but start with small
      cells now.
    type: Tweak
